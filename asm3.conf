# ASM3 Docker Configuration File
# This configuration uses environment variables for flexible deployment

# Base application URLs (from environment variables)
base_url = ${ASM3_BASE_URL}
service_url = ${ASM3_SERVICE_URL}

# Locale and timezone settings
locale = en
timezone = 0

# Logging configuration (enhanced for monitoring)
log_location = stderr
log_debug = false
log_level = ERROR
log_errors_to_file = true
log_file = /var/log/asm3/application.log

# Database configuration for PostgreSQL
db_type = POSTGRESQL
db_host = ${ASM3_DBHOST}
db_port = ${ASM3_DBPORT}
db_username = ${ASM3_DBUSERNAME}
db_password = ${ASM3_DBPASSWORD}
db_name = ${ASM3_DBNAME}

# Database settings (optimized for low memory)
db_has_asm2_pk_table = false
db_decode_html_entities = false
db_timeout = 0
db_connection_pool_size = 10
db_connection_pool_recycle = 3600

# Session management (optimized for memory)
session_timeout = 1800
session_max_idle = 900
session_cleanup_interval = 300

# Deployment settings
deployment_type = wsgi
session_secure_cookie = ${ASM3_SESSION_SECURE_COOKIE}
session_debug = false

# File storage
dbfs_store = database

# Error handling
email_errors = false
admin_email = ${ASM3_ADMIN_EMAIL:-admin@example.com}

# JavaScript optimization
minify_js = false
rollup_js = false

# Email configuration
smtp_server = { "host": "${ASM3_SMTP_HOST}", "port": ${ASM3_SMTP_PORT}, "username": "${ASM3_SMTP_USERNAME}", "password": "${ASM3_SMTP_PASSWORD}", "usetls": ${ASM3_SMTP_TLS} }
from_address = ${ASM3_FROM_ADDRESS}

multiple_databases = ${ASM3_MULTIPLE_DATABASES}
multiple_databases_type = ${ASM3_MULTIPLE_DATABASES_TYPE}
multiple_databases_map = ${ASM3_MULTIPLE_DATABASES_MAP}

# AI Assistant
ai_enabled = ${ASM3_AI_ENABLED}
ai_api_key = ${ASM3_AI_API_KEY}
ai_model = ${ASM3_AI_MODEL}
