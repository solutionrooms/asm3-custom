services:
  nginx:
    image: nginx:alpine
    ports:
      - "8095:80"
      - "443:443"
      # Port 80 is also needed for Let's Encrypt challenges during SSL initialization
      # The init-ssl.sh script will temporarily add "80:80" mapping when needed
    volumes:
      - ./nginx-processed.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    environment:
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME}
    depends_on:
      - asm3
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    profiles:
      - ssl-management

  asm3:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASM3_CONF=/app/asm3.conf
      - ASM3_DBTYPE=${ASM3_DBTYPE}
      - ASM3_DBHOST=${ASM3_DBHOST}
      - ASM3_DBPORT=${ASM3_DBPORT}
      - ASM3_DBNAME=${ASM3_DBNAME}
      - ASM3_DBUSERNAME=${ASM3_DBUSERNAME}
      - ASM3_DBPASSWORD=${ASM3_DBPASSWORD}
      - ASM3_MULTIPLE_DATABASES=${ASM3_MULTIPLE_DATABASES}
      - ASM3_MULTIPLE_DATABASES_TYPE=${ASM3_MULTIPLE_DATABASES_TYPE}
      - ASM3_MULTIPLE_DATABASES_MAP=${ASM3_MULTIPLE_DATABASES_MAP}
      - ASM3_BASE_URL=${ASM3_BASE_URL}
      - ASM3_SERVICE_URL=${ASM3_SERVICE_URL}
      - ASM3_DEBUG=${ASM3_DEBUG}
      # DBFS/S3 storage configuration
      - ASM3_DBFS_STORE=${ASM3_DBFS_STORE}
      - ASM3_DBFS_S3_BUCKET=${ASM3_DBFS_S3_BUCKET}
      - ASM3_DBFS_S3_ACCESS_KEY_ID=${ASM3_DBFS_S3_ACCESS_KEY_ID}
      - ASM3_DBFS_S3_SECRET_ACCESS_KEY=${ASM3_DBFS_S3_SECRET_ACCESS_KEY}
      - ASM3_DBFS_S3_ENDPOINT_URL=${ASM3_DBFS_S3_ENDPOINT_URL}
      - ASM3_DBFS_S3_BACKUP_BUCKET=${ASM3_DBFS_S3_BACKUP_BUCKET}
      - ASM3_DBFS_S3_BACKUP_ACCESS_KEY_ID=${ASM3_DBFS_S3_BACKUP_ACCESS_KEY_ID}
      - ASM3_DBFS_S3_BACKUP_SECRET_ACCESS_KEY=${ASM3_DBFS_S3_BACKUP_SECRET_ACCESS_KEY}
      - ASM3_DBFS_S3_BACKUP_ENDPOINT_URL=${ASM3_DBFS_S3_BACKUP_ENDPOINT_URL}
      - ASM3_DBFS_S3_MIGRATE_BUCKET=${ASM3_DBFS_S3_MIGRATE_BUCKET}
      - ASM3_DBFS_S3_MIGRATE_ACCESS_KEY_ID=${ASM3_DBFS_S3_MIGRATE_ACCESS_KEY_ID}
      - ASM3_DBFS_S3_MIGRATE_SECRET_ACCESS_KEY=${ASM3_DBFS_S3_MIGRATE_SECRET_ACCESS_KEY}
      - ASM3_DBFS_S3_MIGRATE_ENDPOINT_URL=${ASM3_DBFS_S3_MIGRATE_ENDPOINT_URL}
      - ASM3_ADMIN_EMAIL=${ASM3_ADMIN_EMAIL}
      - ASM3_FROM_ADDRESS=${ASM3_FROM_ADDRESS}
      - ASM3_SMTP_SERVER=${ASM3_SMTP_SERVER}
      - ASM3_ROLLUP_JS=${ASM3_ROLLUP_JS}
      - GEO_BATCH=${GEO_BATCH}
      - GEO_LIMIT=${GEO_LIMIT}
      # Python memory optimizations
      - PYTHONOPTIMIZE=1
      - PYTHONDONTWRITEBYTECODE=1
      - MALLOC_TRIM_THRESHOLD_=100000
      - MALLOC_MMAP_THRESHOLD_=131072
    volumes:
      - ./asm3.conf.template:/app/asm3.conf.template:ro
      - asm3_config:/app/config
      - ./customizations:/app/customizations:ro
      - ./custom_scripts:/app/custom_scripts:ro
      # Live-mount key scripts for dynamic updates in dev
      - ./weight_monitor.py:/app/weight_monitor.py:ro
      - ./scripts:/app/scripts:ro
      - ./raw_data:/app/raw_data
      - asm3_media:/app/media
      - ./logs/asm3:/var/log/asm3
      # Development: Mount source code for hot-reload
      - ./src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "envsubst < /app/asm3.conf.template > /app/asm3.conf && 
             python3 main.py 5000"
    

  postgres:
    image: postgres:13
    environment:
      - POSTGRES_DB=asm3
      - POSTGRES_USER=asm3
      - POSTGRES_PASSWORD=asm3
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
      - ./postgres-optimization.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asm3 -d asm3"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  asm3_media:
  asm3_config:
  certbot_certs:
  certbot_www:
