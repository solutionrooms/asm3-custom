# PostgreSQL Memory Optimization for Low-Memory Environments
# Target: 300MB container limit on 960MB system

# Network Settings (Essential for Docker)
listen_addresses = '*'                   # Listen on all interfaces
port = 5432                             # Standard PostgreSQL port

# Memory Settings (Conservative for 300MB limit)
shared_buffers = 64MB                    # 20% of available memory
effective_cache_size = 200MB             # OS + PG cache estimate
work_mem = 2MB                          # Per operation memory
maintenance_work_mem = 16MB             # VACUUM, CREATE INDEX memory
temp_buffers = 8MB                      # Temporary table buffers

# Connection Settings
max_connections = 20                    # Limit concurrent connections
max_prepared_transactions = 5          # Prepared transaction limit
statement_timeout = 0                   # Disable statement timeout (was causing cancellations)
idle_in_transaction_session_timeout = 300000  # 5min idle timeout

# WAL Settings (Reduce memory usage)
wal_buffers = 2MB                       # WAL buffer size
checkpoint_completion_target = 0.9      # Spread checkpoint I/O
checkpoint_timeout = 15min              # Checkpoint frequency

# Query Planning
random_page_cost = 1.1                  # Assume SSD storage
effective_io_concurrency = 200          # SSD concurrent I/O

# Logging (Reduce overhead)
log_statement = 'none'                  # Disable query logging
log_min_duration_statement = 1000      # Only log slow queries (1s+)
log_checkpoints = off
log_lock_waits = off

# Background Writer
bgwriter_delay = 200ms                  # Background writer delay
bgwriter_lru_maxpages = 100            # Max pages per round

# Autovacuum (Reduce memory impact)
autovacuum_work_mem = 8MB              # Memory for autovacuum
autovacuum_max_workers = 2             # Limit vacuum workers