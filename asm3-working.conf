# ASM3 Working Configuration
base_url = http://localhost:5000
service_url = http://localhost:5000/service

# Locale and timezone settings
locale = en
timezone = 0

# Logging configuration
log_location = stderr
log_debug = true

# Database configuration for PostgreSQL
db_type = POSTGRESQL
db_host = postgres
db_port = 5432
db_username = asm3
db_password = asm3
db_name = asm3

# Deployment settings
deployment_type = wsgi
session_secure_cookie = false

# File storage
dbfs_store = database

# Error handling
email_errors = false
admin_email = admin@example.com