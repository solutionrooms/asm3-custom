events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging configuration
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Rate limiting zones (protect against overload)
    limit_req_zone $binary_remote_addr zone=login:10m rate=3r/m;      # Login attempts
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;       # API requests  
    limit_req_zone $binary_remote_addr zone=general:10m rate=60r/m;   # General requests
    limit_conn_zone $binary_remote_addr zone=perip:10m;               # Connections per IP

    # Proxy cache configuration for static files
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=static_cache:10m max_size=100m inactive=24h use_temp_path=off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Upstream for ASM3
    upstream asm3_backend {
        server asm3:5000;
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        server_name ${NGINX_SERVER_NAME};

        # Let's Encrypt challenge location
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name ${NGINX_SERVER_NAME};

        # SSL configuration
        ssl_certificate /etc/letsencrypt/live/${NGINX_SERVER_NAME}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${NGINX_SERVER_NAME}/privkey.pem;

        # SSL security settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/letsencrypt/live/${NGINX_SERVER_NAME}/chain.pem;

        # File upload size
        client_max_body_size 500M;

        # Proxy settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Timeouts
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;

        # Let's Encrypt challenge location (backup)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Rate limiting for login attempts
        location /login {
            limit_req zone=login burst=3 nodelay;
            limit_conn perip 5;
            proxy_pass http://asm3_backend;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Rate limiting for API endpoints
        location /service {
            limit_req zone=api burst=10 nodelay;
            limit_conn perip 8;
            proxy_pass http://asm3_backend;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Serve static files with caching (performance optimization)
        location /static/ {
            proxy_pass http://asm3_backend;
            
            # Enable caching for static files
            proxy_cache static_cache;
            proxy_cache_valid 200 304 24h;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_revalidate on;
            proxy_cache_lock on;
            
            # Add cache status header for debugging
            add_header X-Cache-Status $upstream_cache_status;
            
            # Browser caching for static files
            expires 24h;
            add_header Cache-Control "public, immutable";
            
            # Reduce timeouts for static files
            proxy_read_timeout 30;
            proxy_connect_timeout 30;
            proxy_send_timeout 30;
        }

        # General rate limiting for all other requests
        location / {
            limit_req zone=general burst=20 nodelay;
            limit_conn perip 10;
            proxy_pass http://asm3_backend;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
